<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgroEdge Vision // Offline Crop Diagnostic & Irrigation</title>
  <style>
    :root {
      --bg: #06090e;
      --card: #0d131f;
      --border: #1e293b;
      --accent-green: #10b981;
      --accent-cyan: #06b6d4;
      --accent-amber: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent-cyan);
    }
    label {
      display: block;
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      background: #05080f;
      border: 1px solid var(--border);
      color: white;
      box-sizing: border-box;
    }
    button {
      margin-top: 18px;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      background: var(--accent-green);
      border: none;
      color: #022c22;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .result-box {
      margin-top: 16px;
      padding: 14px;
      background: #04060a;
      border-radius: 8px;
      border-left: 4px solid var(--accent-green);
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
    }
    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1 style="margin:0; font-size:22px;">🌱 AgroEdge Vision</h1>
        <p style="margin:4px 0 0; color:var(--muted); font-size:13px;">Offline Zero-Install Crop Diagnostic & Irrigation Advisor</p>
      </div>
      <span class="badge">● 100% OFFLINE READY</span>
    </header>

    <div class="grid">
      <!-- Precision Irrigation Module -->
      <div class="card">
        <h2>💧 FAO-56 Penman-Monteith Irrigation</h2>
        <label>Crop Type & Growth Stage</label>
        <select id="cropSelect">
          <option value="1.15">Tomato (Mid-Season, Kc=1.15)</option>
          <option value="1.20">Maize / Corn (Mid-Season, Kc=1.20)</option>
          <option value="1.05">Wheat (Flowering, Kc=1.05)</option>
          <option value="1.10">Soybean (Pod Formation, Kc=1.10)</option>
          <option value="0.85">Potato (Late Ripening, Kc=0.85)</option>
        </select>

        <label>Mean Daily Temperature (°C)</label>
        <input type="number" id="tempC" value="26.5" step="0.5" />

        <label>Relative Humidity (%)</label>
        <input type="number" id="rh" value="48" min="10" max="100" />

        <label>Field Zone Area (Square Meters)</label>
        <input type="number" id="areaM2" value="1000" step="100" />

        <button onclick="calculateIrrigation()">COMPUTE DAILY WATER QUOTA</button>
        <div id="irrigationResult" class="result-box" style="display:none;"></div>
      </div>

      <!-- Crop Health & Disease Diagnostic -->
      <div class="card">
        <h2>🔬 Foliar Disease & Lesion Scan</h2>
        <label>Point Camera or Select Leaf Foliage</label>
        <input type="file" id="leafUpload" accept="image/*" onchange="diagnoseLeaf(event)" />

        <label style="margin-top:16px;">Simulate Quick Optical Patch</label>
        <select id="simPatch">
          <option value="rust">Orange Cinnamon Pustules (Leaf Rust)</option>
          <option value="blight">Concentric Necrotic Rings (Early Blight)</option>
          <option value="chlorosis">Pale Yellowing Leaf (Nitrogen Chlorosis)</option>
          <option value="healthy">Deep Vigorous Green (Healthy Foliage)</option>
        </select>
        <button style="background:var(--accent-cyan); color:#083344;" onclick="diagnoseSimulated()">RUN DIAGNOSTIC SCAN</button>

        <div id="diagnosticResult" class="result-box" style="display:none;"></div>
      </div>
    </div>
  </div>

  <script>
    function calculateIrrigation() {
      const kc = parseFloat(document.getElementById('cropSelect').value);
      const T = parseFloat(document.getElementById('tempC').value);
      const rh = parseFloat(document.getElementById('rh').value);
      const area = parseFloat(document.getElementById('areaM2').value);

      // FAO-56 Penman-Monteith evaluation
      const delta = (4098 * (0.6108 * Math.exp((17.27 * T) / (T + 237.3)))) / Math.pow(T + 237.3, 2);
      const gamma = 0.000665 * 101.3;
      const es = 0.6108 * Math.exp((17.27 * T) / (T + 237.3));
      const ea = es * (rh / 100);
      const vpd = Math.max(0, es - ea);
      const Rn = 15.2; // MJ/m2/day net radiation
      const u2 = 2.0;  // m/s wind speed

      const num = 0.408 * delta * Rn + gamma * (900 / (T + 273)) * u2 * vpd;
      const den = delta + gamma * (1 + 0.34 * u2);
      const et0 = num / den;

      const etc = et0 * kc;
      const efficiency = 0.88; // Drip irrigation
      const grossWaterMm = etc / efficiency;
      const totalLiters = Math.round(grossWaterMm * area);

    }

    function diagnoseSimulated() {
      const type = document.getElementById('simPatch').value;
      const resDiv = document.getElementById('diagnosticResult');
      resDiv.style.display = 'block';

      if (type === 'rust') {

      } else if (type === 'blight') {

      } else if (type === 'chlorosis') {
        resDiv.innerHTML = ;
      } else {
        resDiv.innerHTML = ;
      }
    }
  </script>
</body>
</html>
